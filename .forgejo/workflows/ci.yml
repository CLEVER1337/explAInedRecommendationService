# Runs on every push. Builds nothing, pushes nothing, touches no cluster — this is the
# cheap check that the code still works, and it is deliberately separate from the release
# path in .forgejo/workflows/release.yml.
#
# Why the split: the release images are expensive. explAIned-ml's jobs image alone carries
# torch and the SBERT weights, and the runner has a 10 GB disk whose layer cache is pruned
# weekly. Building that on every push to a branch would fill the disk to prove something a
# test suite proves faster.

name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: docker
    # The `docker` label maps to a node image, which has no .NET. Overriding the job
    # container is the documented way to bring one — and the SDK image, not the runtime,
    # because this compiles.
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4

      - name: Test
        # The tests run against Database:Provider=InMemory and Cache:Provider=Memory, so
        # nothing here needs PostgreSQL, Redis or Kafka to be reachable. That is a property
        # worth keeping: the moment a test needs a real database, this job needs services
        # and stops being cheap.
        run: dotnet test explAInedRecommendationService.sln --nologo --verbosity minimal
